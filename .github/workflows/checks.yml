name: Quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-test
          POSTGRES_DB: media_security
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:local-test@127.0.0.1:5432/media_security
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm run typecheck
      - run: deno check supabase/functions/purge-sites/index.ts
      - run: npm run lint
      - run: npm run lint:boundaries
      - run: npm test
      - uses: actions/cache@v6
        with:
          path: |
            apps/site/.next/cache
            apps/admin/.next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/**/*.ts', 'apps/**/*.tsx', 'packages/**/*.ts', 'packages/**/*.tsx') }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-
      - run: npm run build:demo
      - run: npm run build:admin
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium webkit
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium webkit
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-results
          path: test-results
