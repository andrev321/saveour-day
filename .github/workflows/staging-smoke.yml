name: Staging smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_ADMIN_URL: ${{ vars.STAGING_ADMIN_URL }}
      STAGING_SITE_URL: ${{ vars.STAGING_SITE_URL }}
      STAGING_PANEL_STORAGE_STATE: ${{ secrets.STAGING_PANEL_STORAGE_STATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.staging.config.ts
