name: Deploy production

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Push pending supabase/migrations to production before deploying"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Verify Quality checks passed for commit
        run: |
          conclusion=$(gh api "repos/${{ github.repository }}/actions/workflows/checks.yml/runs?head_sha=${{ github.sha }}&status=completed" --jq '.workflow_runs[0].conclusion // ""')
          if [ "$conclusion" != "success" ]; then
            echo "Quality checks workflow has not succeeded for ${{ github.sha }} (status: ${conclusion:-missing})."
            exit 1
          fi

  migrate:
    needs: verify-checks
    if: ${{ inputs.apply_migrations == true }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: "2.20.5"
      - name: Push pending migrations to production
        run: supabase db push --remote="$SUPABASE_DB_URL" --yes

  deploy-admin:
    needs: [verify-checks, migrate]
    if: ${{ always() && needs.verify-checks.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROD_ADMIN_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Deploy admin to Vercel production
        run: npx --yes vercel@65.14.0 deploy --prod --yes --token="$VERCEL_TOKEN"

  deploy-site:
    needs: [verify-checks, migrate]
    if: ${{ always() && needs.verify-checks.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROD_SITE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Deploy site to Vercel production
        run: npx --yes vercel@65.14.0 deploy --prod --yes --token="$VERCEL_TOKEN"
